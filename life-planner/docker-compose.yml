# Standalone planner: docker compose up -d  ->  http://<this-machine>:8000 (home network).
# To put it online on your own domain behind a login wall, run it from ../homelab instead (see homelab/GUIDE.md).
# For a quick public address without a domain, use Tailscale Funnel (SETUP.md step 6).
services:
  planner:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/srv/data  # the SQLite database lives here: back this folder up

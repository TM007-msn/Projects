# docker compose up -d   -> planner on http://<this-machine>:8000 (home network).
# For a public HTTPS address use Tailscale Funnel on the host (see SETUP.md step 6).
# Alternative if you own a domain on Cloudflare: docker compose --profile tunnel up -d
services:
  planner:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/srv/data  # the SQLite database lives here: back this folder up

  # Optional alternative to Tailscale Funnel; only starts with --profile tunnel.
  cloudflared:
    image: cloudflare/cloudflared:latest  # pin a specific tag once you have it working
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - planner
